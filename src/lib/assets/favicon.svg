<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<title>vote.ke</title>
	<defs>
		<clipPath id="rounded"><rect width="64" height="64" rx="14" /></clipPath>
	</defs>
	<g clip-path="url(#rounded)">
		<!-- Kenyan flag bands: black / white / red / white / green, white bands thin -->
		<rect width="64" height="64" fill="#ffffff" />
		<rect y="0" width="64" height="19" fill="#000000" />
		<rect y="19" width="64" height="4" fill="#ffffff" />
		<rect y="23" width="64" height="18" fill="#bb0000" />
		<rect y="41" width="64" height="4" fill="#ffffff" />
		<rect y="45" width="64" height="19" fill="#006600" />
	</g>
	<text
		x="32"
		y="34"
		text-anchor="middle"
		dominant-baseline="central"
		font-family="Arial, Helvetica, sans-serif"
		font-weight="800"
		font-size="58"
		fill="#ffffff"
		stroke="#000000"
		stroke-width="1.5"
		paint-order="stroke"
	>V</text>
</svg>
